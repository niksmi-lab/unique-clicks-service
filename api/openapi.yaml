openapi: 3.1.0
info:
  title: Unique Clicks API
  version: 1.0.0
  description: Counts one click per user, author and UTC day.
servers:
  - url: http://localhost:8080
paths:
  /v1/clicks:
    post:
      operationId: trackClick
      summary: Record a unique click
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClickRequest'
      responses:
        '202':
          description: Click accepted and persisted
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          description: Storage operation timed out
  /v1/metrics/yesterday:
    post:
      operationId: getYesterdayMetrics
      summary: Get unique clicks for the previous UTC day
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetricsRequest'
      responses:
        '200':
          description: Metrics keyed by author ID
          content:
            application/json:
              schema:
                type: object
                required: [metrics]
                properties:
                  metrics:
                    type: object
                    additionalProperties:
                      type: integer
                      format: int64
                      minimum: 0
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          description: Storage operation timed out
  /health/live:
    get:
      operationId: liveness
      summary: Check whether the process is alive
      responses:
        '200':
          description: Process is alive
  /health/ready:
    get:
      operationId: readiness
      summary: Check whether PostgreSQL is reachable
      responses:
        '200':
          description: Service is ready
        '503':
          description: Service is not ready
  /metrics:
    get:
      operationId: prometheusMetrics
      summary: Expose operational metrics for Prometheus
      responses:
        '200':
          description: Prometheus exposition format
          content:
            text/plain:
              schema:
                type: string
components:
  schemas:
    ClickRequest:
      type: object
      additionalProperties: false
      required: [user_id, author_id]
      properties:
        user_id:
          type: integer
          format: int64
          minimum: 1
        author_id:
          type: integer
          format: int64
          minimum: 1
    MetricsRequest:
      type: object
      additionalProperties: false
      required: [author_ids]
      properties:
        author_ids:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: integer
            format: int64
            minimum: 1
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
