services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: clicks
      POSTGRES_USER: clicks
      POSTGRES_PASSWORD: clicks
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/000001_create_clicks.up.sql:/docker-entrypoint-initdb.d/000001_create_clicks.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clicks -d clicks"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      args:
        VERSION: dev
    environment:
      APP_ENV: production
      SERVER_ADDR: :8080
      DATABASE_URL: postgres://clicks:clicks@postgres:5432/clicks?sslmode=disable
      RETENTION_DAYS: 30
      CLEANUP_INTERVAL: 1h
      DB_MAX_CONNECTIONS: 10
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.13.2
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    ports:
      - "9090:9090"
    volumes:
      - ./deployments/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deployments/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  prometheus_data:
